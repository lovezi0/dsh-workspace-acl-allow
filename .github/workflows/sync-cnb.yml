name: sync-to-cnb
on:
  push:
    branches: ["*"]
    tags: ["*"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Sync branches and tags to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -e
          git config --global user.email "bot@cnb.local"
          git config --global user.name "cnb-sync"

          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/txpoi/lovezi0/dsh-workspace-acl-allow.git"
          git remote add cnb "$REMOTE" || git remote set-url cnb "$REMOTE"

          # 将 origin 下所有远程分支映射成本地分支
          # 这样 git push --all 才会把所有分支都推上去
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '^origin/HEAD$' | sed 's#^origin/##'); do
            git branch --track "$ref" "origin/$ref" 2>/dev/null || true
          done

          git push cnb --all
          git push cnb --tags

          # 如果有 LFS 大文件再补这两行
          git lfs fetch --all origin
          git lfs push --all "$REMOTE"
